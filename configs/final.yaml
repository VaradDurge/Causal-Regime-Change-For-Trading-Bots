# Frozen from the validation grid before any holdout or live run.
# No cell met the pre-registered criterion (position std > 0.05, |a|>0.95 share < 0.80, ablation >= 0.10) on all four tapes.
# The baseline had the lowest mean deficit, and no one-factor change reduced it, so the native recipe stays.
reward_mode: raw
reward_scale: 100.0
diff_sharpe_eta: 0.01
pos_extreme_penalty: 0.0
pos_variance_bonus: 0.0
