ent_coef: 0.01
ent_coef_start: null
collapse_log_every: 10000
window: 2000
window_sampling: uniform
regime_balance_beta: 3.0
sign_flip_prob: 0.0
regime_perturb_prob: 0.0
faithfulness_regularizer: false
faithfulness_reg_coef: 0.1
prob_temperature: 1.0
prob_floor: 0.0
tracker: v1
tracker_matching: nearest
tracker_death_after: 20
tracker_cost_quantile: 0.95
verifier: legacy
delta_ab: 0.15
delta_cf: 0.1
delta_sens: 0.05
cf_pick: nearest
timesteps: 500000
threads: 2
seed: 42
protocol: timeframe
asset: BTC
timeframe: 1h
stage: validate
